[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-model"
version = "0.1.0"
description = "Reproducible ECG abnormality modeling pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6.0", "scikit-learn>=1.3", "torch>=2.1"]

[project.optional-dependencies]
data = ["wfdb>=4.1", "neurokit2>=0.2"]
export = ["onnx>=1.15", "onnxruntime>=1.16"]
tracking = ["mlflow>=2.9"]
dev = ["pytest>=7.4", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
